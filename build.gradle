plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '8.10.4'
	id 'com.modrinth.minotaur' version '2.+'
}

spotless {
	java {
		eclipse().configFile('.java-formatter.xml')
		target 'src/**/*.java', 'source/**/*.java'
	}

	groovyGradle {
		target '*.gradle'
		greclipse()
	}
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// https://github.com/granny/Pl3xMap#developers
	exclusiveContent {
		forRepository {
			maven { url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}

	// https://github.com/TwelveIterations/Waystones
	maven { url = "https://maven.twelveiterations.com/repository/maven-public/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"pl3xwaystones" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "maven.modrinth:pl3xmap:${project.pl3xmap_version}"
	modImplementation "net.blay09.mods:waystones-fabric:${project.waystones_version}"

	// Loom strips the mods nested in Pl3xMap, so they're added back to run it locally.
	modLocalRuntime "org.incendo:cloud-fabric:${project.cloud_fabric_version}"
	modLocalRuntime "net.kyori:adventure-platform-fabric:${project.adventure_platform_fabric_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(org.gradle.api.tasks.bundling.Jar).configureEach {
	from("LICENSE.md", "README.md")
}

tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
	archiveVersion = "${project.version}+${project.minecraft_version}"
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = project.mod_id
	versionNumber = project.version.toString()
	versionName = providers.environmentVariable("VERSION").orElse("v${project.version}")
	uploadFile = remapJar
	additionalFiles = [remapSourcesJar]
	versionType = "alpha"
	environment = "dedicated_server_only"
	gameVersions = [
		"${project.minecraft_version}"
	]

	dependencies {
		required.version "fabric-api", "${project.fabric_api_version}"
		required.version "pl3xmap", "${project.pl3xmap_version}"
		// Waystones' Modrinth version numbers include the loader, unlike its Maven versions.
		required.version "waystones", project.waystones_version.replace("+", "+fabric-")
	}

	syncBodyFrom = rootProject.file("README.md").text
}

tasks.modrinth.dependsOn(tasks.modrinthSyncBody)

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.

		maven {
			name = "GitHubPackages"
			url = uri("https://maven.pkg.github.com/natoboram/pl3xwaystones")
			credentials {
				username = providers.gradleProperty("gpr.user").getOrNull() ?: System.getenv("GITHUB_USERNAME")
				password = providers.gradleProperty("gpr.key").getOrNull() ?: System.getenv("GITHUB_TOKEN")
			}
		}
	}
}
