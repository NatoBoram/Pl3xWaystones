name: Java Publish

on:
  push:
    tags:
      - v*

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 27
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        if: github.actor != 'nektos/act'
        with:
          name: pl3xwaystones
          path: build/libs
          compression-level: 9
          if-no-files-found: error

  attest:
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write

    needs: build
    if: github.actor != 'nektos/act'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pl3xwaystones
          path: build/libs

      - uses: actions/attest@v4
        with:
          subject-path: build/libs/*

  publish-github:
    permissions:
      packages: write

    needs: build
    if: github.actor != 'nektos/act'
    runs-on: ubuntu-latest

    environment:
      name: github-packages-registry
      url: ${{ steps.url.outputs.url }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 27
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v8
        with:
          name: pl3xwaystones
          path: build/libs

      - run: ./gradlew publish
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: url
        run: |
          url=$(gh api '/users/NatoBoram/packages/maven/com.natoboram.pl3xwaystones/versions' | jq -r --arg NAME "${VERSION#v}" '.[] | select(.name == $NAME) | .package_html_url')
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}

  release:
    permissions:
      contents: write # Upload the release files

    needs:
      - attest
      - build
    if: github.actor != 'nektos/act'
    runs-on: ubuntu-latest

    environment:
      name: github-releases
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pl3xwaystones
          path: build/libs

      - run: gh release create "$VERSION" --generate-notes --repo "$REPO" --title "$VERSION" --verify-tag build/libs/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
